name: inception

services:
  nginx:
    build: requirements/nginx
    image: nginx:inception
    container_name: nginx
    depends_on:
      - wordpress
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
    ports:
      - "443:443"
    networks:
      - inception
    volumes:
      - wordpress:/var/www
    restart: always

  mariadb:
    build: requirements/mariadb
    image: mariadb:inception
    container_name: mariadb
    environment:
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
    secrets:
      - db_password
      - db_root_password
    networks:
      - inception
    volumes:
      - mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: always

  wordpress:
    build: requirements/wordpress
    image: wordpress:inception
    container_name: wordpress
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
    secrets:
      - db_password
      - wp_admin_password
      - wp_user_password
    networks:
      - inception
    volumes:
      - wordpress:/var/www
    restart: always

  # ----------------------------------------------------------------- bonus
  redis:
    build: requirements/bonus/redis
    image: redis:inception
    container_name: redis
    networks:
      - inception
    restart: always

  vsftpd:
    build: requirements/bonus/vsftpd
    image: vsftpd:inception
    container_name: vsftpd
    depends_on:
      - wordpress
    environment:
      FTP_USER: ${FTP_USER}
    secrets:
      - ftp_password
    ports:
      - "21:21"
      - "21100-21104:21100-21104"
    networks:
      - inception
    volumes:
      - wordpress:/var/www
    restart: always

  adminer:
    build: requirements/bonus/adminer
    image: adminer:inception
    container_name: adminer
    depends_on:
      - mariadb
    ports:
      - "8080:8080"
    networks:
      - inception
    restart: always

  website:
    build: requirements/bonus/website
    image: website:inception
    container_name: website
    ports:
      - "8081:8081"
    networks:
      - inception
    restart: always

volumes:
  wordpress:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/wordpress
  mariadb:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_PATH}/mariadb

networks:
  inception:
    driver: bridge

secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_password:
    file: ../secrets/ftp_password.txt
